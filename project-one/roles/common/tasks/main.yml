---
- name: Update apt repository cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install essential system tools and dependencies
  apt:
    name:
      - curl
      - wget
      - git
      - gnupg
      - ca-certificates
      - lsb-release
      - software-properties-common
      - unzip
      - htop
      - python3
      - python3-pip
      - python3-setuptools
      - zsh
    state: present

- name: Ensure python3-docker is installed for Ansible Docker module support
  pip:
    name:
      - docker
      - docker-compose
    state: present
