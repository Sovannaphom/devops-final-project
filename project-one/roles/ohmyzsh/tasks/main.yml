---
- name: Check if Oh My Zsh is already installed for current user
  stat:
    path: "{{ ansible_env.HOME }}/.oh-my-zsh"
  register: ohmyzsh_user_dir

- name: Download Oh My Zsh installer script
  get_url:
    url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
    dest: /tmp/install_ohmyzsh.sh
    mode: '0755'
  when: not ohmyzsh_user_dir.stat.exists

- name: Install Oh My Zsh non-interactively
  shell: /tmp/install_ohmyzsh.sh --unattended
  when: not ohmyzsh_user_dir.stat.exists

- name: Ensure default shell is set to Zsh for user
  user:
    name: "{{ ansible_user | default(ansible_env.USER) }}"
    shell: /bin/zsh
