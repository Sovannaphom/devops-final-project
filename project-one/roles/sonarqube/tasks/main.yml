---
- name: Set vm.max_map_count for SonarQube (Elasticsearch requirement)
  sysctl:
    name: vm.max_map_count
    value: '524288'
    state: present
    reload: yes

- name: Set fs.file-max for SonarQube
  sysctl:
    name: fs.file-max
    value: '131072'
    state: present
    reload: yes

- name: Create SonarQube deploy directory
  file:
    path: /opt/sonarqube
    state: directory
    mode: '0755'

- name: Create docker-compose.yml for SonarQube and Postgres
  copy:
    dest: /opt/sonarqube/docker-compose.yml
    content: |
      version: '3.8'

      services:
        db:
          image: postgres:15-alpine
          environment:
            POSTGRES_USER: sonar
            POSTGRES_PASSWORD: {{ sonarqube_db_password }}
            POSTGRES_DB: sonarqube
          volumes:
            - sonarqube_db_data:/var/lib/postgresql/data
          restart: always

        sonarqube:
          image: sonarqube:community
          depends_on:
            - db
          environment:
            SONAR_JDBC_USERNAME: sonar
            SONAR_JDBC_PASSWORD: {{ sonarqube_db_password }}
            SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonarqube
          ports:
            - "{{ sonarqube_http_port }}:9000"
          volumes:
            - sonarqube_data:/opt/sonarqube/data
            - sonarqube_extensions:/opt/sonarqube/extensions
            - sonarqube_logs:/opt/sonarqube/logs
          restart: always

      volumes:
        sonarqube_db_data:
        sonarqube_data:
        sonarqube_extensions:
        sonarqube_logs:

- name: Start SonarQube stack using docker compose
  shell: docker compose up -d
  args:
    chdir: /opt/sonarqube
