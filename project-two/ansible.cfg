[defaults]
inventory = inventory/k8s-cluster/hosts.yaml
host_key_checking = False
roles_path = roles:~/.ansible/roles
remote_user = ubuntu
private_key_file = ~/.ssh/id_rsa
stdout_callback = default
result_format = yaml
timeout = 30

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
