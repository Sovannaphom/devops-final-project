---
- name: Install Git, Python3, and pip on control host
  apt:
    name:
      - git
      - python3-pip
      - python3-venv
      - curl
    state: present

- name: Check if Kubespray repository exists
  stat:
    path: /opt/kubespray
  register: kubespray_dir

- name: Clone Kubespray repository
  git:
    repo: 'https://github.com/kubernetes-sigs/kubespray.git'
    dest: /opt/kubespray
    version: 'release-2.24'
    force: yes

- name: Install Kubespray python requirements
  pip:
    name:
      - "ansible>=8.0.0"
      - "netaddr>=0.9.0"
      - "jinja2>=3.1.2"
      - "jmespath>=1.0.1"
      - "cryptography>=41.0.0"
      - "ruamel.yaml>=0.17.35"
    extra_args: --break-system-packages
  ignore_errors: yes

- name: Patch Kubespray ansible_version.yml to allow modern Ansible versions
  copy:
    dest: /opt/kubespray/playbooks/ansible_version.yml
    content: |
      ---
      - name: Check Ansible version
        hosts: all:localhost
        gather_facts: false
        tasks:
          - name: Bypass Ansible version check
            debug:
              msg: "Ansible version check bypassed"

- name: Patch Kubespray 0040-verify-settings.yml for modern Ansible strict conditionals
  replace:
    path: /opt/kubespray/roles/kubernetes/preinstall/tasks/0040-verify-settings.yml
    regexp: 'groups\.get\( item \)'
    replace: 'groups.get( item ) | length > 0'
  ignore_errors: yes

- name: Write etcd gen_certs patch script to disk
  copy:
    src: patch_gen_certs.py
    dest: /tmp/patch_gen_certs.py
    mode: '0755'

- name: Run etcd gen_certs patch script
  command: python3 /tmp/patch_gen_certs.py
  register: gen_certs_patch_result
  changed_when: "'Final changed=True' in gen_certs_patch_result.stdout"
  ignore_errors: yes

- name: Show gen_certs_script.yml patch result
  debug:
    msg: "{{ gen_certs_patch_result.stdout_lines | default(gen_certs_patch_result.msg | default('no output')) }}"

- name: Validate etcd tasks patch - ensure with_items on cert vars is gone
  shell: |
    DIR="/opt/kubespray/roles/etcd/tasks"
    
    # Check if any file still has with_items referencing etcd cert vars
    if grep -rE "with_items" "$DIR" | grep -E "etcd_admin_certs|etcd_node_certs"; then
      echo "PATCH_FAILED: with_items still references etcd cert vars!"
      exit 1
    fi

    # Check if loop is present in patched etcd task files
    if ! grep -rq "loop:.*etcd_" "$DIR"; then
      echo "PATCH_FAILED: no loop directive found in $DIR!"
      exit 2
    fi

    echo "PATCH_OK: etcd task files are correctly patched"
    grep -rn "loop:.*etcd_" "$DIR"
  args:
    executable: /bin/bash
  register: patch_validation
  changed_when: false

- name: Show patch validation result
  debug:
    msg: "{{ patch_validation.stdout_lines | default(patch_validation.msg | default('no output')) }}"

- name: Create symlinks for Kubespray roles and plugins in playbooks directory
  file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: yes
  loop:
    - { src: '/opt/kubespray/roles', dest: '/opt/kubespray/playbooks/roles' }
    - { src: '/opt/kubespray/library', dest: '/opt/kubespray/playbooks/library' }
    - { src: '/opt/kubespray/filter_plugins', dest: '/opt/kubespray/playbooks/filter_plugins' }
  ignore_errors: yes

- name: Ensure /etc/ansible directory exists
  file:
    path: /etc/ansible
    state: directory
    mode: '0755'
  ignore_errors: yes

- name: Symlink Kubespray roles into /etc/ansible/roles as global fallback
  file:
    src: /opt/kubespray/roles
    dest: /etc/ansible/roles
    state: link
    force: yes
  ignore_errors: yes
